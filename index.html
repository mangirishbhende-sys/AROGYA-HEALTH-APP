<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c4f">
<meta name="description" content="Arogya Saathi — your AI health companion">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saathi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Arogya Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..700&display=swap" rel="stylesheet">
<style>
/* Arogya Saathi v3 — design tokens
   Konkan green (primary), kokum (alerts & food), monsoon blue (water), turmeric (activity), dusk violet (sleep).
   Type: Bricolage Grotesque for headings & numbers, Atkinson Hyperlegible (built for low vision) for reading text. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface-2:#eef1ec; --ink:#16302b; --ink-2:#3c514c; --muted:#66776f; --line:#dfe4dc; --line-2:#cbd3c8;
  --brand:#1d5c4f; --brand-hover:#174c41; --brand-ink:#ffffff; --brand-soft:#e3eee9;
  --water:#2e6fbf; --water-soft:#e6eef8; --act:#b8741f; --act-soft:#f7eedf;
  --food:#9b2d52; --food-soft:#f6e6ec; --sleep:#5b4e9e; --sleep-soft:#ebe8f5;
  --danger:#b4233a; --danger-soft:#f9e6e8; --ok:#2f7d4f;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --fs:18px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --surface:#16211e; --surface-2:#1c2a26; --ink:#e8efec; --ink-2:#c3d0cb; --muted:#8fa39b; --line:#26352f; --line-2:#33463f;
    --brand:#5cb89f; --brand-hover:#6fc8af; --brand-ink:#0b1a16; --brand-soft:#1b3530;
    --water:#7aaee8; --water-soft:#172838; --act:#e0a85a; --act-soft:#33281a;
    --food:#e07a9c; --food-soft:#3a1d28; --sleep:#a597e6; --sleep-soft:#25213d;
    --danger:#f0717f; --danger-soft:#3a1a1f; --ok:#6cc58f;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --surface-2:#1c2a26; --ink:#e8efec; --ink-2:#c3d0cb; --muted:#8fa39b; --line:#26352f; --line-2:#33463f;
  --brand:#5cb89f; --brand-hover:#6fc8af; --brand-ink:#0b1a16; --brand-soft:#1b3530;
  --water:#7aaee8; --water-soft:#172838; --act:#e0a85a; --act-soft:#33281a;
  --food:#e07a9c; --food-soft:#3a1d28; --sleep:#a597e6; --sleep-soft:#25213d;
  --danger:#f0717f; --danger-soft:#3a1a1f; --ok:#6cc58f;
}
:root.big{ --fs:21px; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num,.val,.stat b,.legend b,.ringpct{font-family:var(--display);font-variant-numeric:tabular-nums}
.shell{max-width:560px;margin:0 auto;min-height:100vh}
main{padding:4px 16px 150px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:1.75rem;line-height:1.15;font-weight:700}
h2{font-size:1.05rem;line-height:1.3;font-weight:650}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.84rem} .xs{font-size:.74rem}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.hidden{display:none!important}

/* app bar */
.appbar{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:22px;height:22px}
.brandname{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.sos{background:var(--danger);color:#fff;border-radius:999px;padding:0 16px;min-height:42px;font-weight:700;font-size:.86rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.sos:hover{filter:brightness(1.08)}
.avatar{width:42px;height:42px;min-height:42px;border-radius:50%;background:var(--brand-soft);border:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.82rem;color:var(--brand);cursor:pointer;padding:0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:14px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.chipicon{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.sec{margin:28px 2px 0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:1.15rem}
button,.btn{font:inherit;font-weight:700;border-radius:var(--r-md);padding:0 18px;min-height:52px;cursor:pointer;background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);transition:background .15s,border-color .15s,transform .08s}
button:hover,.btn:hover{border-color:var(--muted)}
button:active,.btn:active{transform:scale(.98)}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.ghost{background:transparent;border-color:transparent}
.ghost:hover{background:var(--surface-2);border-color:transparent}
.iconbtn{width:44px;min-height:44px;padding:0;border-radius:var(--r-sm)}
button:disabled{opacity:.5;cursor:progress}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;padding:13px 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-height:52px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-weight:700;font-size:.84rem;color:var(--ink-2);margin:16px 0 6px}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}

/* greeting + day summary */
.greet{margin:10px 2px 0}
.greet .date{color:var(--muted);font-size:.86rem}
.greet h1{font-size:2rem;margin-top:2px}
.day{display:flex;align-items:center;gap:22px;margin-top:16px}
.ringbox{position:relative;width:156px;height:156px;flex:none}
.rings{width:100%;height:100%}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringpct{font-size:1.45rem;font-weight:700;line-height:1}
.ringc span{font-size:.7rem;color:var(--muted);margin-top:3px}
.legend{display:grid;gap:12px;flex:1;min-width:0}
.legend .li{display:grid;grid-template-columns:12px 1fr;gap:0 10px;align-items:center}
.legend .dot{width:12px;height:12px;border-radius:4px}
.legend b{font-size:1.25rem;font-weight:700}
.legend b small{font-size:.8rem;color:var(--muted);font-weight:500}
.legend span{grid-column:2;font-size:.8rem;color:var(--muted);line-height:1.2}

/* suggestion */
.insight{border-left:4px solid var(--brand)}
.insight p.txt{font-size:1.04rem;line-height:1.55}
.shimmer{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--surface-2),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin-top:10px}
@keyframes sh{to{background-position:-200% 0}}

/* composer */
.composer{display:flex;gap:16px;align-items:center}
.mic{width:72px;height:72px;min-height:72px;border-radius:50%;padding:0;flex:none;background:var(--brand);color:#fff;border:0}
.mic:hover{background:var(--brand-hover)}
.mic svg{width:30px;height:30px}
.inputwrap{position:relative;margin-top:16px}
.inputwrap textarea{padding-right:60px}
.inputwrap .send{position:absolute;right:8px;bottom:10px;width:44px;min-height:44px;padding:0;border-radius:var(--r-sm)}
.reply{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;background:var(--brand-soft);border-radius:var(--r-md)}
.reply .av{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.reply .av svg{width:16px;height:16px}

/* alert */
.alert{background:var(--danger-soft);border:2px solid var(--danger)}
.alert .chipicon{background:var(--danger);color:#fff}

/* metrics */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tile .top{display:flex;align-items:center;gap:8px}
.tile .top svg{width:18px;height:18px}
.tile .lbl{font-size:.86rem;font-weight:700;color:var(--ink-2)}
.tile .val{font-size:1.85rem;font-weight:700;line-height:1}
.tile .val small{font-family:var(--body);font-size:.78rem;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.tile .acts{display:flex;gap:8px;margin-top:2px}
.tile .acts button{min-height:44px;padding:0 10px;font-size:.84rem;flex:1;border-radius:var(--r-sm)}
.tile .acts .iconbtn{flex:none;width:44px}

/* medicines */
.med{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.med:first-of-type{border-top:0;padding-top:4px}
.med input{position:absolute;opacity:0;pointer-events:none;width:0;height:0;min-height:0}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;transition:.15s;color:transparent}
.med input:checked+.check{background:var(--ok);border-color:var(--ok);color:#fff}
.med input:focus-visible+.check{outline:3px solid var(--brand);outline-offset:2px}
.med .mname{font-weight:700}
.med input:checked~.mname{color:var(--muted);text-decoration:line-through}

/* log */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:56px 36px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0;padding-top:0}
.tl .time{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .chipicon{width:36px;height:36px;border-radius:9px}
.tl .t{font-weight:700;line-height:1.3}
.tl .x{width:36px;min-height:36px;padding:0;border:0;background:transparent;color:var(--muted)}
.tl .x:hover{color:var(--danger)}
.empty{text-align:center;padding:16px 10px;color:var(--muted)}
.empty .chipicon{margin:0 auto 12px;width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand)}

/* photo */
.photo-prev{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r-md);display:block}
.fooditem{display:grid;grid-template-columns:1fr 96px 80px;gap:8px;margin-top:8px}
.fooditem input{min-height:46px;padding:10px}

/* page heads */
.phead{margin:10px 2px 0}
.phead h1{font-size:2rem}
.phead p{margin-top:4px}

/* coach */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.bubble{max-width:84%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.5}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.typing{display:inline-flex;gap:5px;padding:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;font-weight:400;font-size:.88rem;border-radius:999px;background:var(--surface)}
.dock{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom));margin-top:18px;z-index:3}
.dock .card{display:flex;gap:8px;align-items:flex-end;padding:8px;margin:0;border-radius:22px;border-color:var(--line-2);box-shadow:0 8px 28px rgba(22,48,43,.10)}
.dock textarea{min-height:52px;height:52px;border:0;background:transparent;padding:14px 8px;resize:none}
.dock textarea:focus{box-shadow:none}
.dock .mic{width:52px;height:52px;min-height:52px}
.dock .mic svg{width:22px;height:22px}

/* insights */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:4px;gap:4px;margin-top:16px}
.seg button{flex:1;min-height:46px;border:0;background:transparent;border-radius:var(--r-sm);font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,48,43,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line)}
.stat{padding:14px 0 0}
.stat+.stat{padding-left:14px;border-left:1px solid var(--line)}
.stat b{display:block;font-size:1.6rem;font-weight:700;line-height:1.1}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chart .v{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:12px}

/* family */
.sosgrid{display:grid;gap:10px}
.sosgrid .btn{min-height:64px;justify-content:flex-start;padding:0 16px;font-size:1rem;text-align:left}
.sosgrid .btn .chipicon{width:38px;height:38px;background:rgba(255,255,255,.18);color:#fff}
.sosgrid .btn.plain .chipicon{background:var(--brand-soft);color:var(--brand)}
.sosgrid .sub{display:block;font-size:.78rem;font-weight:400;opacity:.9}
.summary{background:var(--surface-2);border-radius:var(--r-md);padding:16px;white-space:pre-wrap;font-size:.92rem;line-height:1.65}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;color:var(--muted);font-size:.82rem}

/* profile */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-weight:700;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.sw{width:52px;height:32px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked+.sw{background:var(--brand)}
.toggle input:checked+.sw::after{left:23px}
.toggle input:focus-visible+.sw{outline:3px solid var(--brand);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.welcome{padding:26px 4px 4px}
.welcome .logo{display:none}
.welcome .logo svg{width:34px;height:34px}
.welcome h1{font-size:2.2rem;line-height:1.1}
.welcome p.lede{margin-top:12px;font-size:1.05rem;color:var(--ink-2);max-width:34ch}
.feats{display:grid;gap:0;margin-top:24px;border-top:1px solid var(--line)}
.feats .row{padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;gap:14px}
.feats b{display:block}
.savebar{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom));margin-top:20px;z-index:3}
.savebar button{width:100%;min-height:58px;font-size:1.05rem;border-radius:16px;box-shadow:0 8px 24px rgba(29,92,79,.25)}

/* bottom nav (phone) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;align-items:center;max-width:560px;margin:0 auto;height:80px}
nav.tabs .brandside,nav.tabs .sideextra{display:none}
nav.tabs .t{flex:1;flex-direction:column;gap:4px;border:0;background:transparent;min-height:64px;padding:0;font-size:.72rem;font-weight:700;color:var(--muted);border-radius:var(--r-md)}
nav.tabs .t svg{width:24px;height:24px}
nav.tabs .t[aria-current="page"]{color:var(--brand)}
nav.tabs .t[aria-current="page"] svg{stroke-width:2.3}
nav.tabs .fab{width:62px;height:62px;min-height:62px;border-radius:50%;margin:-30px 8px 0;padding:0;flex:none;background:var(--brand);color:#fff;border:5px solid var(--bg);box-shadow:0 6px 18px rgba(29,92,79,.35)}
nav.tabs .fab .lbl{display:none}
nav.tabs .fab svg{width:26px;height:26px}

/* overlays */
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(90vw,440px);z-index:20;text-align:center;font-weight:700;font-size:.9rem;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(10,22,19,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px)}}
.sheet h2{font-size:1.25rem}
.sheet .row{margin-top:22px}
.sheet .row button{flex:1}
.listen{position:fixed;inset:0;z-index:40;background:#123f36;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center;animation:fade .2s}
.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ripple 1.8s infinite}
.orb::after{animation-delay:.9s}
@keyframes ripple{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.orb .core{width:100px;height:100px;border-radius:50%;background:#fff;color:#1d5c4f;display:grid;place-items:center}
.orb .core svg{width:40px;height:40px}
.listen h2{font-size:1.8rem;color:#fff}
.listen p{opacity:.9;max-width:340px;font-size:1.05rem}
.listen button{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);min-width:160px}

/* desktop: sidebar app layout */
@media (min-width:960px){
  .shell{max-width:none;margin:0 0 0 264px}
  main{max-width:1080px;margin:0 auto;padding:8px 40px 60px}
  .appbar{padding:16px 40px;max-width:1080px;margin:0 auto}
  .appbar .logo,.appbar .brandname{visibility:hidden}
  nav.tabs{top:0;bottom:0;right:auto;width:264px;border-top:0;border-right:1px solid var(--line);padding:24px 16px}
  nav.tabs .in{flex-direction:column;align-items:stretch;height:100%;gap:4px;max-width:none}
  nav.tabs .brandside{display:flex;align-items:center;gap:12px;padding:0 10px 26px;order:-2}
  nav.tabs .t{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;min-height:50px;padding:0 14px;font-size:.95rem;color:var(--ink-2)}
  nav.tabs .t:hover{background:var(--surface-2)}
  nav.tabs .t[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  nav.tabs .fab{order:-1;width:auto;height:54px;min-height:54px;border-radius:var(--r-md);margin:0 0 18px;border:0;gap:10px;font-size:.95rem;box-shadow:none}
  nav.tabs .fab .lbl{display:inline}
  nav.tabs .fab svg{width:22px;height:22px}
  nav.tabs .sideextra{display:block;margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}

<script>
/* =========================================================
   Arogya Saathi — AI health companion for adults over 60
   Data stays on the device (localStorage). AI: Google Gemini.
   ========================================================= */

// ---------- icons ----------
const P = {
  logo:'<path d="M12 20s-7-4.4-9-9a4.6 4.6 0 0 1 9-3 4.6 4.6 0 0 1 9 3c-.4 1-1 2-1.7 3"/><path d="M14 13h2l1.5-2.5L19.5 16l1.5-3h2"/>',

  water:'<path d="M12 2.8s6.5 6.9 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.8 12 2.8z"/>',

  meal:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M18 3c-2.2 1-3.5 4-3.5 7.5H18V21"/>',

  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14.5 3v4.5H19M9 12.5h7M9 16.5h5"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  phone:'<path d="M5 3h3.5l2 5-2.5 1.5a11 11 0 0 0 6.5 6.5L16 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  speaker:'<path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  send:'<path d="M4 12 20 4l-5.5 16-3-6.5z"/><path d="M11.5 13.5 20 4"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  share:'<path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  shield:'<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14.5 8.5l2 2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  data:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  ambulance:'<path d="M3 17V7a1 1 0 0 1 1-1h10v11M14 10h4l3 3.5V17h-2"/><circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/><path d="M9 17h6M8.5 8.5v4M6.5 10.5h4"/>',
  doctor:'<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || P.note}</svg>`;

// ---------- storage ----------
const KEY = 'arogya_saathi_v1';
let memoryFallback = null;
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return memoryFallback; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ memoryFallback = S; } if (typeof cloudSoon === 'function') cloudSoon(); }
const DEFAULT = {
  profile:{ name:'', age:'', sex:'', height:'', weight:'', diet:'veg', conditions:'', meds:'', goal:'Stay active and eat well',
            waterTarget:8, walkTarget:30, caretakerName:'', caretakerPhone:'', doctorPhone:'' },
  settings:{ lang:'en', big:false, speak:false, apiKey:'', model:'' },
  days:{}, checkin:null, chat:[], lastReply:null
};
let S = Object.assign({}, DEFAULT, load() || {});
S.profile = Object.assign({}, DEFAULT.profile, S.profile);
S.settings = Object.assign({}, DEFAULT.settings, S.settings);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dkey(d = new Date()){ const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function day(k = dkey()){ return S.days[k] || (S.days[k] = { entries:[], meds:{} }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg, ms = 3000){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
const LANGS = { en:{name:'English', voice:'en-IN'}, hi:{name:'हिंदी (Hindi)', voice:'hi-IN'}, mr:{name:'मराठी (Marathi)', voice:'mr-IN'}, kok:{name:'कोंकणी (Konkani)', voice:'mr-IN'} };
const langName = () => LANGS[S.settings.lang]?.name || 'English';
const TYPE = {
  meal:{ icon:'meal', c:'var(--food)', bg:'var(--food-soft)' }, water:{ icon:'water', c:'var(--water)', bg:'var(--water-soft)' },
  activity:{ icon:'activity', c:'var(--act)', bg:'var(--act-soft)' }, sleep:{ icon:'sleep', c:'var(--sleep)', bg:'var(--sleep-soft)' },
  medicine:{ icon:'medicine', c:'var(--brand)', bg:'var(--brand-soft)' }, mood:{ icon:'mood', c:'var(--brand)', bg:'var(--brand-soft)' },
  symptom:{ icon:'symptom', c:'var(--danger)', bg:'var(--danger-soft)' }, note:{ icon:'note', c:'var(--muted)', bg:'var(--surface-2)' }
};
const chipI = (type) => { const t = TYPE[type] || TYPE.note; return `<span class="chipicon" style="background:${t.bg};color:${t.c}">${ic(t.icon)}</span>`; };
const MEAL_TARGET = 3;

function totals(k = dkey()){
  const d = day(k); const t = { water:0, walk:0, cal:0, meals:0, sleep:0, symptoms:[] };
  for (const e of d.entries){
    if (e.type === 'water') t.water += Number(e.glasses) || 1;
    if (e.type === 'activity') t.walk += Number(e.minutes) || 0;
    if (e.type === 'meal'){ t.meals++; t.cal += Number(e.calories) || 0; }
    if (e.type === 'sleep') t.sleep = Math.max(t.sleep, Number(e.hours) || 0);
    if (e.type === 'symptom') t.symptoms.push(e.text);
  }
  t.medsTaken = Object.values(d.meds || {}).filter(Boolean).length;
  return t;
}
function medList(){ return S.profile.meds.split(/[,\n]/).map(s => s.trim()).filter(Boolean); }
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function initials(){ const n = S.profile.name.trim(); return n ? n.split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase() : ''; }
function speak(text){
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = LANGS[S.settings.lang]?.voice || 'en-IN'; u.rate = 0.92;
  speechSynthesis.speak(u);
}

// ---------- dialogs ----------
function confirmSheet(title, msg, ok = 'Confirm', danger = false){
  return new Promise(res => {
    $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <h2 id="shT">${esc(title)}</h2><p class="muted" style="margin-top:8px">${esc(msg)}</p>
      <div class="row"><button id="shNo">Cancel</button><button id="shOk" class="${danger ? 'danger' : 'primary'}">${esc(ok)}</button></div></div></div>`;
    const done = v => { $('#layer').innerHTML = ''; res(v); };
    $('#shNo').onclick = () => done(false); $('#shOk').onclick = () => done(true);
    $('#scrim').onclick = e => { if (e.target.id === 'scrim') done(false); };
    $('#shOk').focus();
  });
}

// ---------- context the AI sees ----------
function profileText(){
  const p = S.profile;
  return `Name: ${p.name || 'unknown'}; age: ${p.age || 'unknown'}; sex: ${p.sex || 'unknown'}; height cm: ${p.height || '?'}; weight kg: ${p.weight || '?'}; diet: ${p.diet}; health conditions (as told by user): ${p.conditions || 'none given'}; medicines: ${p.meds || 'none given'}; goal: ${p.goal}; daily targets: ${p.waterTarget} glasses water, ${p.walkTarget} min gentle activity.`;
}
function weekText(){
  const lines = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i); const k = dkey(d); const t = totals(k);
    const items = (S.days[k]?.entries || []).map(e => `${e.type}: ${e.text}`).slice(-12).join(' | ');
    lines.push(`${k}: water ${t.water} glasses, activity ${t.walk} min, meals ${t.meals} (~${t.cal} kcal), sleep ${t.sleep || '?'} h, medicines ticked ${t.medsTaken}/${medList().length}. ${items}`);
  }
  return lines.join('\n');
}
const SAFETY = `You are Arogya Saathi, a gentle health companion for an older adult (60+) living in Goa, India. You are not a doctor. Never diagnose, never change or suggest medicine doses; for medicine questions say to ask their doctor. Keep advice safe for older adults (gentle walking, yoga, water, balanced Indian home food). Use plain, warm, respectful words. Be brief: older users prefer short answers. If the user mentions chest pain, breathlessness, fainting, sudden weakness or numbness on one side, slurred speech, a fall with injury, very high or very low sugar, or confusion, tell them clearly to call their caretaker or 112 immediately.`;

// ---------- Gemini ----------
const MODELS = ['gemini-flash-latest','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-lite-latest'];
async function gemini(parts, { system = SAFETY, json = false, temperature = 0.4 } = {}){
  const key = S.settings.apiKey.trim();
  if (!key) throw new Error('NO_KEY');
  if (!navigator.onLine) throw new Error('OFFLINE');
  const list = S.settings.model ? [S.settings.model, ...MODELS.filter(m => m !== S.settings.model)] : MODELS;
  let lastErr;
  for (const model of list){
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({
          systemInstruction:{ parts:[{ text: system }] },
          contents:[{ role:'user', parts }],
          generationConfig:{ temperature, ...(json ? { responseMimeType:'application/json' } : {}) }
        })
      });
      if (res.status === 404){ lastErr = new Error('Model not found: ' + model); continue; }
      const data = await res.json();
      if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
      const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
      if (!S.settings.model){ S.settings.model = model; save(); }
      if (!json) return text;
      return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, ''));
    } catch(e){ lastErr = e; if (!/not found/i.test(e.message)) break; }
  }
  throw lastErr || new Error('AI failed');
}
function aiErrorText(e){
  if (e.message === 'NO_KEY') return 'Saved. Connect AI in your profile for smarter tips.';
  if (e.message === 'OFFLINE') return 'Saved offline. I will help more when you are back online.';
  if (/quota|exhaust|429/i.test(e.message)) return 'Saved. The free AI limit is used up for now — try again later.';
  return 'Saved. AI could not answer just now (' + e.message.slice(0,70) + ').';
}

// ---------- offline understanding (works without AI) ----------
const WORDNUM = { a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, half:0.5 };
const n = w => w == null ? null : (isNaN(w) ? WORDNUM[w] ?? null : Number(w));
function localParse(text){
  const s = text.toLowerCase(); const entries = [];
  let m = s.match(/(\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)\s*(glass|glasses|cup|cups|bottle|bottles)\s*(of\s*)?(water|pani)/);
  if (m) entries.push({ type:'water', text:`${m[1]} ${m[2]} of water`, glasses: (n(m[1]) || 1) * (/bottle/.test(m[2]) ? 4 : 1) });
  else if (/\b(water|pani)\b/.test(s) && /\b(drank|drink|had|pilo|piya)\b/.test(s)) entries.push({ type:'water', text:'Water', glasses:1 });
  m = s.match(/(walk|walked|walking|yoga|exercise|cycling|cycled|garden)[^\d]{0,20}(\d+)\s*(min|minute|minutes|hour|hours|hr)/);
  if (m) entries.push({ type:'activity', text: `${m[1][0].toUpperCase() + m[1].slice(1)} · ${m[2]} ${m[3]}`, minutes: /^h/.test(m[3]) ? Number(m[2]) * 60 : Number(m[2]) });
  m = s.match(/(slept|sleep)[^\d]{0,15}(\d+(\.\d+)?)\s*(hour|hours|hr|hrs)/);
  if (m) entries.push({ type:'sleep', text:`Slept ${m[2]} hours`, hours: Number(m[2]) });
  const red = /(chest pain|can'?t breathe|breathless|faint|fainted|fell down|i fell|slurred|numb|one side)/.test(s);
  const food = s.match(/\b(?:had|ate|eaten|khaya|breakfast|lunch|dinner)\b[^.]*?\b(poi|pav|bhaji|rice|chapati|roti|bhakri|dal|curry|fish|idli|dosa|upma|poha|sannas|tea|chai|coffee|biscuit|fruit|banana|egg|sabzi|usal)\b[^,.]*/);
  if (food){ const t = food[0].replace(/^(had|ate|eaten|khaya)\s+/, ''); entries.push({ type:'meal', text: t[0].toUpperCase() + t.slice(1), calories:null }); }
  if (red || /\b(pain|ache|dizzy|tired|fever|cough|swelling)\b/.test(s)) entries.push({ type:'symptom', text });
  if (!entries.length) entries.push({ type:'note', text });
  return { entries, reply: null, alert: red ? 'This may be serious. Please call your caretaker or 112 now.' : null };
}

// ---------- core action: tell Saathi anything ----------
async function tellSaathi(text){
  text = text.trim(); if (!text) return;
  setBusy(true); render();
  let result, fallbackMsg = null;
  try {
    const prompt = `Today is ${new Date().toDateString()}, time ${new Date().toTimeString().slice(0,5)}.
User profile: ${profileText()}
Today so far: ${JSON.stringify(totals())}

The user said (any language): """${text}"""

Turn this into health log entries. Return ONLY JSON:
{"entries":[{"type":"meal|water|activity|sleep|medicine|mood|symptom|note","text":"short English description, sentence case","calories":number or null,"glasses":number or null,"minutes":number or null,"hours":number or null}],
 "reply":"at most 2 short sentences in ${langName()}, warm and specific, one small helpful tip if useful",
 "alert":null or "one short sentence in ${langName()} telling them to call their caretaker or 112 now"}
Rules: You know Indian and Goan home food well (poi, pav, bhaji, xitt-kodi fish curry rice, ukde rice, sannas, sol kadhi, bhakri, chapati, dal, usal, idli, upma, chai). Estimate calories for a typical home portion. Water, coconut water, buttermilk and nimbu pani count as glasses (1 glass = 250 ml); tea and coffee are meals with calories. Activity includes walking, yoga, gardening, stairs, going to the market or temple on foot, in minutes. Medicine = a medicine they took (name it, no doses advice). Symptom = any body complaint. Set alert ONLY for warning signs listed in your instructions.`;
    result = await gemini([{ text: prompt }], { json:true });
    if (!Array.isArray(result.entries)) throw new Error('Bad AI format');
  } catch(e){
    result = localParse(text); fallbackMsg = aiErrorText(e);
  }
  for (const e of result.entries){
    addEntry({ type: TYPE[e.type] ? e.type : 'note', text: e.text || text, calories: e.calories ?? null, glasses: e.glasses ?? null, minutes: e.minutes ?? null, hours: e.hours ?? null, said: text });
  }
  S.lastReply = { text: result.reply || fallbackMsg || 'Saved.', alert: result.alert || null, at: Date.now() };
  save(); setBusy(false); render();
  if (S.settings.speak) speak((result.alert ? result.alert + ' ' : '') + S.lastReply.text);
}
function addEntry(e){ if (e.text) e.text = e.text[0].toUpperCase() + e.text.slice(1); day().entries.push({ id: uid(), t: Date.now(), ...e }); save(); }
function removeEntry(id){ cloud.deleted.add(id); const d = day(); d.entries = d.entries.filter(e => e.id !== id); save(); render(); }

// ---------- food photo ----------
let pendingPhoto = null;
function fileToJpeg(file, max = 800){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = reject; img.src = URL.createObjectURL(file);
  });
}
async function handlePhoto(file){
  if (!file) return;
  const dataUrl = await fileToJpeg(file);
  pendingPhoto = { dataUrl, items:null, loading:true, error:null };
  view = 'home'; render();
  try {
    const out = await gemini([
      { text: `Look at this plate of food. Identify each dish (think of Indian and Goan home food first, e.g. fish curry rice, poi, sannas, bhaji, dal, sabzi, chapati, bhakri) and estimate the portion and calories. Return ONLY JSON: {"items":[{"name":"dish","portion":"e.g. 1 bowl","calories":number}],"confidence":"high|medium|low","note":"one short sentence in ${langName()} with a gentle tip for an older adult"}. If it is not food, return {"items":[],"confidence":"low","note":"I could not see food in this photo."}` },
      { inline_data: { mime_type:'image/jpeg', data: dataUrl.split(',')[1] } }
    ], { json:true });
    pendingPhoto.items = (out.items || []).map(i => ({ name: i.name, portion: i.portion || '', calories: Math.round(Number(i.calories) || 0) }));
    if (!pendingPhoto.items.length) pendingPhoto.items = [{ name:'', portion:'', calories:0 }];
    pendingPhoto.confidence = out.confidence; pendingPhoto.note = out.note;
  } catch(e){
    pendingPhoto.error = e.message === 'NO_KEY' ? 'Connect AI in Profile to recognise dishes automatically. You can type them below.' : 'AI could not read the photo just now. You can type the dishes below.';
    pendingPhoto.items = [{ name:'', portion:'', calories:0 }];
  }
  pendingPhoto.loading = false; render();
}
function savePhotoMeal(){
  const rows = [...document.querySelectorAll('#foodRows .fooditem')].map(r => ({
    name: r.querySelector('.fn').value.trim(), portion: r.querySelector('.fp').value.trim(), calories: Number(r.querySelector('.fc').value) || 0
  })).filter(r => r.name);
  if (!rows.length){ toast('Please add at least one dish'); return; }
  addEntry({ type:'meal', text: rows.map(r => r.portion ? `${r.name} (${r.portion})` : r.name).join(', '), calories: rows.reduce((a,r) => a + r.calories, 0), fromPhoto:true });

  pendingPhoto = null; save(); render(); toast('Meal saved');
}

// ---------- proactive daily check-in ----------
function ruleCheckin(){
  const t = totals(); const p = S.profile; const h = new Date().getHours(); const tips = [];
  const y = new Date(); y.setDate(y.getDate()-1); const ty = totals(dkey(y));
  if (ty.walk >= p.walkTarget) tips.push(`Well done on your ${ty.walk} minutes of activity yesterday.`);
  if (t.water < Math.round(p.waterTarget * Math.min(1, Math.max(0, h - 7) / 13))) tips.push(`Have a glass of water now — you are at ${t.water} of ${p.waterTarget} today.`);
  if (t.walk < p.walkTarget && h >= 16 && h <= 19) tips.push('An easy evening walk of 10–15 minutes would be good.');
  if (h < 11 && !t.sleep) tips.push('Tell me how you slept last night.');
  if (medList().length && t.medsTaken < medList().length) tips.push('Remember to tick your medicines once you take them.');
  if (!tips.length) tips.push('You are doing well today. Keep it gentle and steady.');
  return tips.slice(0,2).join(' ');
}
async function runCheckin(force = false){
  const today = dkey();
  if (!force && S.checkin?.date === today) return;
  S.checkin = { date: today, text: ruleCheckin(), ai:false, loading: !!S.settings.apiKey };
  render();
  if (!S.settings.apiKey) return;
  try {
    const txt = await gemini([{ text: `Now: ${new Date().toString().slice(0,21)}.
Profile: ${profileText()}
Last 7 days:
${weekText()}

Write today's check-in message for this person in ${langName()}. At most 3 short sentences: notice one real pattern from the last days (good or needs care), then suggest ONE small, specific, doable action for today that fits an older adult and their conditions. No lists, no greeting line, no emojis.` }], { temperature:0.6 });
    S.checkin = { date: today, text: txt, ai:true, loading:false };
  } catch(e){ S.checkin.loading = false; }
  save(); render();
}

function listen(onText, prompt = 'Tell me what you ate, drank or did'){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast('Voice needs Google Chrome. You can type instead.'); return; }
  rec = new SR(); rec.lang = LANGS[S.settings.lang]?.voice || 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1;
  let finalText = '';
  $('#layer').innerHTML = `<div class="listen" role="dialog" aria-modal="true" aria-label="Listening">
    <div class="orb"><div class="core">${ic('mic')}</div></div>
    <h2>Listening…</h2><p id="heard">${esc(prompt)}</p>
    <button id="stopListen">${ic('x')} Cancel</button></div>`;
  $('#stopListen').onclick = () => { finalText = ''; try { rec.abort(); } catch(e){} };
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; finalText = t; const h = $('#heard'); if (h) h.textContent = '“' + t + '”'; };
  rec.onerror = e => { if (e.error !== 'aborted') toast(e.error === 'not-allowed' ? 'Please allow the microphone' : 'I could not hear that. Please try again.'); };
  rec.onend = () => { $('#layer').innerHTML = ''; rec = null; if (finalText.trim()) onText(finalText.trim()); };

}

function loadDemo(){

// ---------- cloud: Clerk sign-in + Supabase storage ----------
const CFG = window.SAATHI_CONFIG || {};
const cloud = { pulled:false, ready:false, enabled: !!(CFG.clerkPublishableKey && CFG.supabaseUrl && CFG.supabaseKey), user:null, db:null, status:'', lastSync:null, deleted:new Set(), timer:null };
function loadScript(src, attrs = {}){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    Object.entries(attrs).forEach(([k,v]) => s.setAttribute(k, v)); s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
}
async function cloudInit(){
  if (!cloud.enabled) return;
  try {
    const pk = CFG.clerkPublishableKey.trim();
    const fapi = atob(pk.split('_')[2]).replace(/\$$/, '');
    await loadScript(`https://${fapi}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`, { 'data-clerk-publishable-key': pk });
    await window.Clerk.load({ appearance:{ variables:{ colorPrimary:'#1d5c4f', fontSize:'16px', borderRadius:'12px' } } });
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js');
    cloud.db = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
      accessToken: async () => (await window.Clerk.session?.getToken()) ?? null
    });
    cloud.ready = true;
    const onUser = (user) => {
      const was = cloud.user?.id; cloud.user = user || null;
      if (cloud.user && cloud.user.id !== was){ cloud.pulled = false; cloudPull(); }
      if (!cloud.user){ cloud.status = ''; cloud.pulled = false; }
      render();
    };
    onUser(window.Clerk.user);
    window.Clerk.addListener(({ user }) => { if ((user?.id || null) !== (cloud.user?.id || null)) onUser(user); });
  } catch(e){ cloud.status = 'Cloud is unavailable right now (' + e.message.slice(0,60) + ')'; render(); }
}
function cloudSignIn(){ if (!cloud.ready){ toast(cloud.enabled ? 'Cloud is still loading. Try again in a moment.' : 'Cloud is not set up yet.'); return; } window.Clerk.openSignIn({}); }
async function cloudSignOut(){ if (!await confirmSheet('Sign out?', 'Your data stays saved online and on this phone.', 'Sign out')) return; await window.Clerk.signOut(); toast('Signed out'); }
const entryRow = (e, dayKey) => ({ id: e.id, user_id: cloud.user.id, day: dayKey, logged_at: new Date(e.t).toISOString(), type: e.type, description: e.text,
  calories: e.calories != null ? Math.round(e.calories) : null, glasses: e.glasses ?? null, minutes: e.minutes != null ? Math.round(e.minutes) : null, hours: e.hours ?? null });
function appState(){ return { days: S.days, chat: S.chat, settings: { ...S.settings, apiKey:'' } }; }
async function cloudPush(){
  if (!cloud.ready || !cloud.user || !cloud.pulled) return;
  cloud.status = 'Saving…'; refreshCloudLine();
  try {
    const { error: e1 } = await cloud.db.from('health_profiles').upsert({ user_id: cloud.user.id, name: S.profile.name || null, profile: S.profile, app_state: appState(), updated_at: new Date().toISOString() });
    if (e1) throw e1;
    const rows = []; const since = new Date(); since.setDate(since.getDate() - 30);
    for (const [k, d] of Object.entries(S.days)) if (new Date(k) >= since) for (const e of d.entries) rows.push(entryRow(e, k));
    if (rows.length){ const { error: e2 } = await cloud.db.from('health_entries').upsert(rows); if (e2) throw e2; }
    if (cloud.deleted.size){ const ids = [...cloud.deleted]; const { error: e3 } = await cloud.db.from('health_entries').delete().in('id', ids); if (!e3) ids.forEach(i => cloud.deleted.delete(i)); }
    cloud.lastSync = new Date(); cloud.status = '';
  } catch(e){ cloud.status = 'Not saved online: ' + (e.message || e).toString().slice(0,80); }
  refreshCloudLine();
}
async function cloudPull(){
  cloud.status = 'Loading your saved data…'; render();
  try {
    const { data, error } = await cloud.db.from('health_profiles').select('*').maybeSingle();
    if (error) throw error;
    if (data){
      const remote = data.app_state || {};
      for (const [k, d] of Object.entries(remote.days || {})){
        const local = day(k); const ids = new Set(local.entries.map(e => e.id));
        for (const e of d.entries || []) if (!ids.has(e.id)) local.entries.push(e);
        local.entries.sort((a,b) => a.t - b.t);
        local.meds = { ...(d.meds || {}), ...(local.meds || {}) };
      }
      if (!S.profile.name && data.profile && data.profile.name) S.profile = Object.assign({}, DEFAULT.profile, data.profile);
      if (!S.chat.length && remote.chat) S.chat = remote.chat;
    }
    const { data: rows, error: e2 } = await cloud.db.from('health_entries').select('*').order('logged_at');
    if (e2) throw e2;
    let added = 0;
    for (const r of rows || []){
      const d = day(r.day); if (d.entries.some(e => e.id === r.id)) continue;
      d.entries.push({ id: r.id, t: new Date(r.logged_at).getTime(), type: r.type, text: r.description || '', calories: r.calories, glasses: r.glasses != null ? Number(r.glasses) : null, minutes: r.minutes, hours: r.hours != null ? Number(r.hours) : null });
      d.entries.sort((a,b) => a.t - b.t); added++;
    }
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    if (data || added) toast('Your saved data is loaded');
    cloud.pulled = true; cloud.status = ''; await cloudPush();
  } catch(e){ cloud.status = 'Could not load saved data: ' + (e.message || e).toString().slice(0,80); }
  render();
}
function cloudSoon(){ if (!cloud.user) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, 1500); }
function cloudLine(){
  if (!cloud.enabled) return 'Not set up yet';
  if (!cloud.ready) return cloud.status || 'Connecting…';
  if (!cloud.user) return 'Signed out. Your data is only on this phone.';
  if (cloud.status) return cloud.status;
  return cloud.lastSync ? 'Saved online at ' + cloud.lastSync.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : 'Signed in';
}
function refreshCloudLine(){ const el = $('#cloudLine'); if (el) el.textContent = cloudLine(); }
function vCloudCard(){
  const u = cloud.user; const email = u?.primaryEmailAddress?.emailAddress || '';
  return `<section class="card">
    <div class="card-h"><span class="chipicon" style="background:var(--water-soft);color:var(--water)">${ic('shield')}</span><div class="grow"><h2>Save online</h2><p class="xs muted" id="cloudLine">${esc(cloudLine())}</p></div>${u ? '<span class="badge">On</span>' : ''}</div>
    ${u ? `<p class="small">Signed in as <b>${esc(email || u.fullName || 'you')}</b>. Everything you log is saved securely, so it is safe if this phone is lost and you can sign in on another phone.</p>
        <div class="two" style="margin-top:12px"><button data-act="cloudSync">Save now</button><button data-act="cloudOut">Sign out</button></div>`
      : `<p class="small muted">Sign in with your email or Google account to keep a safe online copy of your health log.</p>
        <button class="primary" style="width:100%;margin-top:12px" data-act="cloudIn" ${cloud.enabled ? '' : 'disabled'}>Sign in to save online</button>`}
  </section>`;
}

// ---------- start ----------
render();
if (view === 'home') runCheckin();
window.addEventListener('online', () => toast('Back online'));
cloudInit();
window.matchMedia('(min-width: 960px)').addEventListener('change', () => render());
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
